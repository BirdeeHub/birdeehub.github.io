<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nothing to See Here ♡</title>

    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #fff7fb;
        color: #493b46;
        font-family: system-ui, sans-serif;
        text-align: center;
      }

      main {
        max-width: 500px;
        padding: 2rem;
      }

      .heart {
        font-size: 3rem;
        margin-bottom: 1rem;
      }

      h1 {
        margin: 0 0 1rem;
        font-size: 2rem;
      }

      p {
        margin: 0.5rem 0;
        line-height: 1.6;
      }

      .note {
        margin-top: 1.5rem;
        padding: 1rem 1.25rem;
        border-radius: 1rem;
        background: #ffffff;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
      }
    </style>
  </head>

  <body>
    <main>
      <div class="heart">♡</div>

      <h1>There's no site here!</h1>

      <p>
        You found my redirect hub.
      </p>

      <div class="note">
        This site doesn't host any content itself.<br>
        It just keeps old links working by redirecting
        its subdirectories to their new homes.
      </div>
    </main>
  </body>
</html>
