<script>
const oldPrefix = "/nix-wrapper-modules/";
const newBase = "https://nix-community.github.io/nix-wrapper-modules/";

if (window.location.pathname.startsWith(oldPrefix)) {
    const rest = window.location.pathname.slice(oldPrefix.length);
    window.location.replace(newBase + rest + window.location.search + window.location.hash);
}
</script>
